name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    paths:
      - "vscode-extension/**"
      - ".github/workflows/ci.yml"

defaults:
  run:
    working-directory: vscode-extension

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (esbuild + tsc)
        run: npm run compile

      - name: Package check (.vsix, dry run)
        run: npx vsce package --no-dependencies -o dist-check.vsix

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension-vsix
          path: vscode-extension/dist-check.vsix
          retention-days: 7
